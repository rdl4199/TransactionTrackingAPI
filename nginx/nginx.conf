events {
    worker_connections 1024;
}

http {
    upstream transaction_tracker_backend {
        least_conn;
        server transaction-tracker-1:8080;
        server transaction-tracker-2:8080;
        server transaction-tracker-3:8080;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://transaction_tracker_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
